apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server-deployment
  labels:
    app: mlflow-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-server
  template:
    metadata:
      labels:
        app: mlflow-server
    spec:
      containers:
      - name: mlflow-container
        image: ghcr.io/mlflow/mlflow:v2.11.1
        command:
          - mlflow
          - server
          - --host
          - "0.0.0.0"
          - --port
          - "5000"
          - --backend-store-uri
          - sqlite:///mlflow/mlflow.db
          - --default-artifact-root
          - s3://ml-model-registry-store-2026/artifacts
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        env:
        - name: AWS_REGION
          value: "us-east-1"
        volumeMounts:
        - name: mlflow-db
          mountPath: /mlflow
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: mlflow-db
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-server-service
spec:
  type: LoadBalancer
  selector:
    app: mlflow-server
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000