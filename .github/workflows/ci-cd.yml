name: CD Pipeline (AWS ECR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # NOTE: AWS deployment is currently disabled due to expired AWS trial/account.
  # The configuration is kept here for reference.
  cd-pipeline-aws:
    name: CD Pipeline (Build & Push to ECR)
    runs-on: ubuntu-latest
    if: false  # Safely skips this job without deleting or breaking the code

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: nexusbio-repo
          IMAGE_TAG: latest
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
